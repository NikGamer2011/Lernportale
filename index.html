<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernportale</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8ec5fc;touch-action:none;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas{display:block}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:0;right:0;text-align:center;color:#fff;text-shadow:0 1px 4px #000;font-weight:700;font-size:15px;pointer-events:none}
#bot{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);left:0;right:0;text-align:center}
#name{color:#fff;text-shadow:0 2px 6px #000;font-size:30px;font-weight:800;margin-bottom:10px}
#go{border:0;border-radius:14px;padding:14px 34px;font-size:18px;font-weight:800;color:#fff;background:var(--c,#2ecc71);box-shadow:0 3px 10px rgba(0,0,0,.4)}
#dots{margin-top:14px}#dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);margin:0 4px;transition:transform .3s,background .3s}#dots i.on{background:#fff;transform:scale(1.4)}
.ar{position:fixed;top:50%;transform:translateY(-50%);width:62px;height:62px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:rgba(0,0,0,.35);color:#fff;font-size:30px;z-index:2}
#L{left:calc(env(safe-area-inset-left,0px) + 10px)}#Rt{right:calc(env(safe-area-inset-right,0px) + 10px)}
#panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:5}
#box{background:#fff;color:#111;border-radius:16px;padding:20px;width:min(86vw,360px);border-top:10px solid var(--c)}
#box h2{margin:0 0 4px;font-size:22px}#box p{margin:0 0 14px;color:#555;font-size:14px}
#box a{display:block;padding:14px;margin:8px 0;border-radius:12px;background:var(--c);color:#fff;text-decoration:none;font-weight:700;text-align:center}
#box button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:#eee;font-size:15px}
#viewer{display:none;position:fixed;inset:0;z-index:9;background:#fff}
#viewer iframe{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top,0px) + 48px);width:100%;height:calc(100% - env(safe-area-inset-top,0px) - 48px);border:0}
#vbar{position:absolute;top:0;left:0;right:0;height:calc(env(safe-area-inset-top,0px) + 48px);padding-top:env(safe-area-inset-top,0px);background:#222;display:flex;align-items:center}
#vbar button{margin-left:10px;border:0;border-radius:10px;padding:9px 16px;font-size:15px;font-weight:700;background:#fff;color:#111}
</style></head><body>
<div id="top">Wähle ein Portal mit den Pfeilen</div>
<button class="ar" id="L" aria-label="Links">‹</button><button class="ar" id="Rt" aria-label="Rechts">›</button>
<div id="bot"><div id="name"></div><button id="go">Betreten</button><div id="dots"></div></div>
<div id="viewer"><div id="vbar"><button id="vback">← Zurück</button></div><iframe id="vframe" title="Lernapp"></iframe></div>
<div id="panel"><div id="box"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PORTALS=[
{n:'Biologie',c:'#2ecc71',v:[['Biologie-Lernapp','LtjMY9Kd4oABxek1nABqeM']]},
{n:'Englisch',c:'#f1c40f',v:[['Inside India – Vokabeln','Qu61RqjUv7z9V8ZeewdTwG'],['Station 1 – Vokabeltrainer','HVyXVVDpYLXe5RuZRTuxBy'],['Station 2 – Vokabeltrainer','Jkg2Y3DwiuegLNVnuGcV2m']]},
{n:'Technik',c:'#aab4bd',v:[['Elektrotechnik-Quiz','8WMjFjywS1HcVXec6uxg4y'],['Stromkreis-Trainer','7t3bXyMPXtHJvQ5tcJhSMe']]},
{n:'Deutsch',c:'#e74c3c',v:[['Deutsch-Quiz zur Klausur','RJgLeG6HUn6YuhcfiKk3F6']]},
{n:'WBS',c:'#e67e22',v:[['Versicherungen-Lernapp','Xh5ijGU7VHwCKijWCW2ZRE']]}
];
const N=PORTALS.length,STEP=Math.PI*2/N,R=12,ADD=THREE.AdditiveBlending,DS=THREE.DoubleSide;
function tex(fn,s){const cv=document.createElement('canvas');cv.width=cv.height=s;fn(cv.getContext('2d'),s);return new THREE.CanvasTexture(cv)}
const scene=new THREE.Scene();
scene.background=tex((x,s)=>{const g=x.createLinearGradient(0,0,0,s);g.addColorStop(0,'#2f6fd0');g.addColorStop(.55,'#8ec5fc');g.addColorStop(1,'#e6f3ff');x.fillStyle=g;x.fillRect(0,0,s,s)},256);
scene.fog=new THREE.Fog(0xcfe6fb,30,95);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,300);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,1));
const sun=new THREE.DirectionalLight(0xffffff,.5);sun.position.set(15,30,10);scene.add(sun);
function add(m,x,y,z,p){m.position.set(x,y,z);p.add(m);return m}
// baseplate with studs
const studs=tex((x,s)=>{x.fillStyle='#56626f';x.fillRect(0,0,s,s);x.strokeStyle='rgba(0,0,0,.22)';x.lineWidth=4;x.strokeRect(0,0,s,s);const g=x.createRadialGradient(s*.42,s*.38,2,s/2,s/2,s*.3);g.addColorStop(0,'#94a2b2');g.addColorStop(1,'#4a5561');x.fillStyle=g;x.beginPath();x.arc(s/2,s/2,s*.26,0,7);x.fill()},128);
studs.wrapS=studs.wrapT=THREE.RepeatWrapping;studs.repeat.set(40,40);studs.anisotropy=4;
const side=new THREE.MeshLambertMaterial({color:0x3b434d});
const base=new THREE.Mesh(new THREE.BoxGeometry(80,1,80),[side,side,new THREE.MeshLambertMaterial({map:studs}),side,side,side]);base.position.y=-.5;scene.add(base);
// centre platform
add(new THREE.Mesh(new THREE.CylinderGeometry(4.6,4.9,.3,64),new THREE.MeshLambertMaterial({color:0xe3eaf2})),0,.15,0,scene);
const cr=add(new THREE.Mesh(new THREE.RingGeometry(3.6,3.9,64),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.8,side:DS})),0,.32,0,scene);cr.rotation.x=-Math.PI/2;
function label(t,c){const cv=document.createElement('canvas');cv.width=320;cv.height=64;const x=cv.getContext('2d');x.font='bold 38px system-ui';x.textAlign='center';x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,8,320,48);x.fillStyle=c;x.fillText(t,160,46);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));s.scale.set(5,1,1);return s}
const swirl=tex((x,s)=>{x.translate(s/2,s/2);x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=9;x.lineCap='round';for(let k=0;k<4;k++){x.rotate(Math.PI/2);x.beginPath();for(let r=4;r<s/2-6;r+=2){const a=r*.035;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.stroke()}},256);
const discs=[];
PORTALS.forEach((p,i)=>{const a=-i*STEP,g=new THREE.Group();g.position.set(Math.sin(a)*R,0,Math.cos(a)*R);
const col=new THREE.Color(p.c);
// path from centre to portal
const pg=new THREE.Group();pg.rotation.y=a;scene.add(pg);
const st=add(new THREE.Mesh(new THREE.PlaneGeometry(1.6,R-5),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.4})),0,.03,(R+5)/2,pg);st.rotation.x=-Math.PI/2;
// pedestal
add(new THREE.Mesh(new THREE.CylinderGeometry(3.2,3.5,.3,48),new THREE.MeshLambertMaterial({color:0x2b323b})),0,.15,0,g);
const pr=add(new THREE.Mesh(new THREE.RingGeometry(2.7,3.05,48),new THREE.MeshBasicMaterial({color:col,side:DS})),0,.32,0,g);pr.rotation.x=-Math.PI/2;
const fg=add(new THREE.Mesh(new THREE.CircleGeometry(2.7,48),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.25,blending:ADD,depthWrite:false})),0,.33,0,g);fg.rotation.x=-Math.PI/2;
// portal
add(new THREE.Mesh(new THREE.TorusGeometry(2.3,.3,16,48),new THREE.MeshBasicMaterial({color:col})),0,2.9,0,g);
add(new THREE.Mesh(new THREE.TorusGeometry(2.0,.07,8,48),new THREE.MeshBasicMaterial({color:0xffffff})),0,2.9,0,g);
add(new THREE.Mesh(new THREE.CircleGeometry(2.05,48),new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.35,side:DS,depthWrite:false})),0,2.9,0,g);
const d=add(new THREE.Mesh(new THREE.CircleGeometry(2.05,48),new THREE.MeshBasicMaterial({map:swirl,color:col,transparent:true,blending:ADD,depthWrite:false,side:DS})),0,2.9,.02,g);discs.push(d);
// sparkles
const n=40,geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
p.ph=[];for(let k=0;k<n;k++)p.ph.push([Math.random()*6.28,.5+Math.random()*.8,Math.random()*6.28]);
p.pts=new THREE.Points(geo,new THREE.PointsMaterial({color:col,size:.2,transparent:true,opacity:.9,depthWrite:false,blending:ADD}));g.add(p.pts);
add(label(p.n,p.c),0,6.2,0,g);
g.lookAt(0,0,0);scene.add(g)});
// carousel state (portal i sits at angle -i*STEP, so next = turn right)
let idx=0,tgt=0,cur=0,t=0,from=0,tt=1;
const nameEl=document.getElementById('name'),dots=document.getElementById('dots');
dots.innerHTML=PORTALS.map(()=>'<i></i>').join('');
function ui(){const p=PORTALS[idx];nameEl.textContent=p.n;document.body.style.setProperty('--c',p.c);dots.querySelectorAll('i').forEach((d,k)=>d.className=k===idx?'on':'')}
function go(dir){if(panelOpen)return;from=cur;tt=0;tgt-=dir*STEP;idx=((idx+dir)%N+N)%N;ui()}
const next=()=>go(1),prev=()=>go(-1);
document.getElementById('Rt').onclick=next;document.getElementById('L').onclick=prev;
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='d')next();else if(e.key==='ArrowLeft'||e.key==='a')prev();else if(e.key==='Enter'||e.key===' ')show(PORTALS[idx])});
let sx=null;ren.domElement.addEventListener('pointerdown',e=>sx=e.clientX);
ren.domElement.addEventListener('pointerup',e=>{if(sx===null)return;const dx=e.clientX-sx;sx=null;
if(dx<-50)next();else if(dx>50)prev();else{const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);if(ray.intersectObject(discs[idx]).length)show(PORTALS[idx])}});
const panel=document.getElementById('panel'),box=document.getElementById('box');let panelOpen=false;
function show(p){panelOpen=true;box.style.setProperty('--c',p.c);box.innerHTML='<h2>Portal '+p.n+'</h2><p>Wähle eine Version zum Lernen:</p>'+p.v.map(v=>'<a href="#" data-k="'+v[1]+'">'+v[0]+'</a>').join('')+'<button id="back">Zurück zu den Portalen</button>';panel.style.display='flex';document.getElementById('back').onclick=()=>{panel.style.display='none';panelOpen=false}}

function dec(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}
const viewer=document.getElementById('viewer'),vframe=document.getElementById('vframe');
box.addEventListener('click',e=>{const a=e.target.closest('a[data-k]');if(!a)return;e.preventDefault();vframe.srcdoc=dec(APPS[a.dataset.k]);viewer.style.display='block'});
document.getElementById('vback').onclick=()=>{viewer.style.display='none';vframe.srcdoc=''};
document.getElementById('go').onclick=()=>show(PORTALS[idx]);
ui();
const clk=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);t+=dt;
tt=Math.min(1,tt+dt/1.1);const e=tt*tt*tt*(tt*(tt*6-15)+10);cur=from+(tgt-from)*e;
cam.position.set(0,3.2,0);cam.lookAt(Math.sin(cur)*R,2.6,Math.cos(cur)*R);
discs.forEach((d,i)=>{d.rotation.z=-t*(.8+i*.05)});
PORTALS.forEach(p=>{const q=p.pts.geometry.attributes.position;p.ph.forEach((s,k)=>{const an=s[0]+t*s[1],r=2.45+Math.sin(t*2+s[2])*.25;q.setXYZ(k,Math.cos(an)*r,2.9+Math.sin(an)*r,Math.sin(t*1.5+s[2])*.5)});q.needsUpdate=true});
ren.render(scene,cam)}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
loop();
</script></body></html>
